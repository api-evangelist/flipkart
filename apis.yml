  name: Flipkart Marketplace Seller API
  description: 'The Flipkart Marketplace Seller API (v3) lets sellers and integration partners manage
    listings, orders, shipments, returns, and reports on the Flipkart marketplace programmatically.
    It is a REST API hosted at api.flipkart.net, secured with OAuth 2.0 (client-credentials for
    self-access apps and authorization-code for third-party apps), and includes an Order Management
    Notification service for order-event webhooks.'
