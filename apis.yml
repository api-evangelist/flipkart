aid: flipkart
name: Flipkart
description: 'Flipkart is one of India''s largest e-commerce marketplaces, headquartered in Bengaluru
  and majority-owned by Walmart. For third-party developers and sellers it publishes the Flipkart
  Marketplace Seller API (v3), an OAuth 2.0 protected REST API hosted at api.flipkart.net that covers
  listing management, order and shipment management, returns, and report generation, plus an Order
  Management Notification (webhook) service for order events. Flipkart also runs an affiliate program
  with its own tooling. This profile captures Flipkart''s public developer surface: the seller API,
  its OAuth authentication and scopes, conventions, lifecycle, and domain security posture.'
